# JavaScript reconnaissance and secret discovery
version: "2.0"
category: js_secrets

tools:
  linkfinder:
    official_docs:
      - https://github.com/GerbenJavado/LinkFinder
    summary: Extracts endpoints and parameters from JavaScript files.
    parameters:
      - id: input-js
        flags: ["-i", "{js_url}", "-o", "cli"]
        when_to_use: STATIC_ROUTE_EXTRACTION on collected JS URLs from katana.
        rationale: "LinkFinder -i accepts JS URL or file; -o cli stdout output."
        operational_triggers: [manifest_base]
      - id: regex
        flags: ["-r", "-"]
        when_to_use: Custom regex for framework-specific route patterns.
        rationale: "-r regex filter per LinkFinder documentation."
        operational_triggers: [api_surface_detected]

  secretfinder:
    official_docs:
      - https://github.com/m4ll0k/SecretFinder
    summary: Finds secrets and API keys in JavaScript source.
    parameters:
      - id: input
        flags: ["-i", "{url}", "-o", "cli"]
        when_to_use: SECRET_INDICATOR_DISCOVERY on JS/HTML pages.
        rationale: "SecretFinder scans for high-entropy strings and API key patterns."
        operational_triggers: [manifest_base]
      - id: extract
        flags: ["-e"]
        when_to_use: Export findings to file for analyst review.
        rationale: "-e export mode per SecretFinder CLI."
        operational_triggers: [large_target_set]

  trufflehog:
    official_docs:
      - https://github.com/trufflesecurity/trufflehog
    summary: Secret scanner for git repos and filesystem paths.
    parameters:
      - id: filesystem-json
        flags: ["filesystem", "{path}", "--json"]
        when_to_use: REPOSITORY_SECRET_DISCOVERY on cloned repos or JS bundles.
        rationale: "trufflehog v3 filesystem source with JSON output per docs."
        operational_triggers: [manifest_base]
      - id: only-verified
        flags: ["--only-verified"]
        when_to_use: Reduce false positives; only report verified live secrets.
        rationale: "trufflehog verified secrets mode calls provider APIs to confirm."
        operational_triggers: [manifest_base]
      - id: concurrency
        flags: ["--concurrency", "4"]
        when_to_use: Reduce when scanning large repos causes memory pressure.
        rationale: "Limits parallel file scanning workers."
        operational_triggers: [large_target_set]

  gitleaks:
    official_docs:
      - https://github.com/gitleaks/gitleaks
    summary: Git secret scanner using regex rules.
    parameters:
      - id: detect-json
        flags: ["detect", "--source", "{path}", "--report-format", "json"]
        when_to_use: Repository or directory secret scan.
        rationale: "gitleaks detect command documented in README."
        operational_triggers: [manifest_base]
      - id: no-git
        flags: ["--no-git"]
        when_to_use: Scan filesystem directory without git history.
        rationale: "--no-git scans files only, not commit history."
        operational_triggers: [manifest_base]
      - id: redact
        flags: ["--redact"]
        when_to_use: Always in shared artifacts; redact secret values in report.
        rationale: "gitleaks --redact prevents secret leakage in stdout/logs."
        operational_triggers: [manifest_base]

  github-code-search:
    official_docs:
      - https://docs.github.com/en/rest/search/search
    summary: GitHub code search API for domain/secret references.
    parameters:
      - id: code-search-query
        flags: ['"{domain}" in:file']
        when_to_use: CODE_REFERENCE_DISCOVERY for subdomain and secret mentions.
        rationale: "GitHub search API syntax per official REST documentation."
        operational_triggers: [manifest_base]
      - id: per-page
        flags: ["per_page=100"]
        when_to_use: Maximize results per API call within rate limits.
        rationale: "GitHub API pagination per_page parameter max 100."
        operational_triggers: [large_target_set]
