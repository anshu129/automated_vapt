# Adaptive parameter rules — JS & secrets
version: "2.0"

rules:
  - id: param-trufflehog-verified
    tool: trufflehog
    reference_param: only-verified
    when:
      always: true
    add_args: ["--only-verified"]
    explanation: >-
      Report only provider-verified secrets to reduce false positive analyst load.

  - id: param-trufflehog-concurrency-large
    tool: trufflehog
    reference_param: concurrency
    when:
      any_of: [large_target_set]
    add_args: ["--concurrency", "4"]
    explanation: >-
      Large repo scan; cap trufflehog workers for memory stability.

  - id: param-gitleaks-redact
    tool: gitleaks
    reference_param: redact
    when:
      always: true
    add_args: ["--redact"]
    explanation: >-
      Always redact secret values in gitleaks JSON artifacts stored in platform.

  - id: param-gitleaks-no-git-fs
    tool: gitleaks
    reference_param: no-git
    when:
      capability: SECRET_INDICATOR_DISCOVERY
    add_args: ["--no-git"]
    explanation: >-
      Filesystem JS bundle scan without git history per gitleaks --no-git.

  - id: param-linkfinder-api-regex
    tool: linkfinder
    reference_param: regex
    when:
      any_of: [api_surface_detected]
    add_args: ["-r", "/api/"]
    explanation: >-
      API routes; filter LinkFinder output for /api/ path patterns.
