services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vapt
      POSTGRES_PASSWORD: vapt
      POSTGRES_DB: vapt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn vapt_platform.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://vapt:vapt@postgres:5432/vapt
      DATABASE_URL_SYNC: postgresql+psycopg://vapt:vapt@postgres:5432/vapt
      REDIS_URL: redis://redis:6379/0
      AI_ENABLED: "false"
      MCP_ENABLED: "false"
      LOG_LEVEL: INFO
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
